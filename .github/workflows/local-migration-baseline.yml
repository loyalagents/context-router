# Main product checks run once, in isolated jobs. The legacy aggregate name
# remains the final required verdict; ci.yml covers only hosted maintenance.
name: Product CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validation-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      profile: ${{ steps.selection.outputs.profile }}
      binding: ${{ steps.selection.outputs.binding }}
      lanes: ${{ steps.selection.outputs.lanes }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Select affected checks
        run: node scripts/local-migration/ci-validation-policy.mjs --select
        timeout-minutes: 2
        id: selection
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.0.8
        with:
          version: 10.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Verify toolchain
        run: node scripts/check-toolchain.mjs
        timeout-minutes: 1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        timeout-minutes: 10
      - name: Test documentation and CI mechanisms
        run: node --test scripts/check-markdown-links.test.mjs scripts/print-repo-structure.test.mjs scripts/local-migration/check-contract-baseline.test.mjs scripts/local-migration/gate-runner.test.mjs scripts/local-migration/gate-phases.test.mjs scripts/local-migration/restart-smoke.test.mjs scripts/local-migration/test-database.test.mjs scripts/local-migration/web-support-smoke.test.mjs scripts/local-migration/eval-test-discovery.test.mjs scripts/local-migration/toolchain-contract.test.mjs scripts/local-migration/ci-path-filters.test.mjs scripts/local-migration/runtime-process.test.mjs scripts/local-migration/web-runtime-config.test.mjs scripts/local-migration/runtime-resources.test.mjs scripts/local-migration/packaging-smoke.test.mjs scripts/local-migration/local-database-smoke.test.mjs scripts/local-migration/local-model-smoke.test.mjs scripts/local-migration/local-mcp-smoke.test.mjs scripts/local-migration/local-ui-smoke.test.mjs
        timeout-minutes: 5
      - name: Test backend documentation consumers
        run: pnpm --fail-if-no-match --filter backend exec jest --selectProjects unit --runInBand --runTestsByPath test/contracts/runtime-composition.spec.ts
        timeout-minutes: 2
      - name: Test orchestrator documentation consumers
        run: pnpm --fail-if-no-match --filter local-orchestrator exec node --import tsx --test test/operator-docs.test.ts
        timeout-minutes: 1
      - name: Check Markdown links
        run: node scripts/check-markdown-links.mjs
        timeout-minutes: 1
      - name: Compare public contracts with verified base
        run: node scripts/local-migration/check-nonruntime.mjs
        timeout-minutes: 3
        env:
          MIGRATION_GATE_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
  backend:
    needs: validation-selection
    if: ${{ !cancelled() && (needs.validation-selection.result != 'success' || fromJSON(needs.validation-selection.outputs.lanes).backend) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.0.8
        with:
          version: 10.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Prepare private pinned Node
        run: bash scripts/local-migration/ci-private-node.sh
        timeout-minutes: 1
      - name: Verify toolchain
        run: node scripts/check-toolchain.mjs
        timeout-minutes: 1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        timeout-minutes: 10
      - name: Generate Prisma client
        run: pnpm --filter backend prisma:generate
        timeout-minutes: 5
      - name: Build backend
        run: pnpm --filter backend build
        timeout-minutes: 5
        env:
          NODE_ENV: production
      - name: Unit tests
        run: pnpm --filter backend test:unit
        timeout-minutes: 5
      - name: SQLite persistence and workers
        run: pnpm --filter backend test:local-database:tests-only
        timeout-minutes: 10
      - name: Local model boundary
        run: pnpm --filter backend test:local-model
        timeout-minutes: 5
      - name: Local MCP boundary
        run: pnpm --filter backend test:local-mcp
        timeout-minutes: 5
      - name: Local browser boundary
        run: pnpm --filter backend test:local-ui
        timeout-minutes: 5
    name: backend-tests
  postgres:
    needs: validation-selection
    if: ${{ !cancelled() && (needs.validation-selection.result != 'success' || fromJSON(needs.validation-selection.outputs.lanes).postgres) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.0.8
        with:
          version: 10.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Verify toolchain
        run: node scripts/check-toolchain.mjs
        timeout-minutes: 1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        timeout-minutes: 10
      - name: Generate Prisma and typecheck seeds
        run: |-
          pnpm --filter backend prisma:generate
          pnpm --filter backend typecheck:seed
        timeout-minutes: 5
      - name: Migrate isolated fixture
        run: pnpm --filter backend exec prisma migrate deploy
        timeout-minutes: 3
        env: &a1
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/context_router_test
      - name: PostgreSQL integration
        run: pnpm --filter backend test:integration
        timeout-minutes: 8
        env: *a1
      - name: Hosted HTTP end-to-end
        run: pnpm --filter backend test:e2e:tests-only
        timeout-minutes: 5
        env: *a1
      - name: Deterministic stored-state scenarios
        run: |-
          pnpm eval:run --scenario samir-desai-i9-template-smoke
          pnpm eval:run --scenario elena-marquez-i9-template-smoke
        timeout-minutes: 3
        env: *a1
    name: postgres-tests
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: context_router_test
        ports:
          - 5433:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
  web:
    needs: validation-selection
    if: ${{ !cancelled() && (needs.validation-selection.result != 'success' || fromJSON(needs.validation-selection.outputs.lanes).web) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.0.8
        with:
          version: 10.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Prepare private pinned Node
        run: bash scripts/local-migration/ci-private-node.sh
        timeout-minutes: 1
      - name: Verify toolchain
        run: node scripts/check-toolchain.mjs
        timeout-minutes: 1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        timeout-minutes: 10
      - name: Bind tracked schema before generation
        run: |-
          echo "MIGRATION_GATE_TRACKED_SDL_SHA256=$(git show HEAD:apps/backend/src/schema.gql | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
          echo "MIGRATION_GATE_DIAGNOSTICS_DIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
        timeout-minutes: 1
      - name: Generate backend Prisma client
        run: pnpm --filter backend prisma:generate
        timeout-minutes: 5
      - name: Build backend
        run: pnpm --filter backend build
        timeout-minutes: 5
        env:
          NODE_ENV: production
      - name: Install pinned Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium
        timeout-minutes: 10
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright
      - name: Build web
        run: pnpm --filter web build
        timeout-minutes: 5
        env:
          NODE_ENV: production
      - name: Authenticated dashboard and browser helpers
        run: pnpm --filter web test:local-ui
        timeout-minutes: 10
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright
      - name: Historical demo without provider sessions
        run: node --test --test-concurrency=1 examples/demo-10-2026/*.test.mjs
        timeout-minutes: 5
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright
      - name: Verify generated clients and tracked SDL
        run: node scripts/local-migration/check-generated-integrity.mjs
        timeout-minutes: 5
    name: frontend-build
  desktop:
    needs: validation-selection
    if: ${{ !cancelled() && (needs.validation-selection.result != 'success' || fromJSON(needs.validation-selection.outputs.lanes).desktop) }}
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.0.8
        with:
          version: 10.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Prepare private pinned Node
        run: bash scripts/local-migration/ci-private-node.sh
        timeout-minutes: 1
      - name: Verify toolchain
        run: node scripts/check-toolchain.mjs
        timeout-minutes: 1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        timeout-minutes: 10
      - name: Assert supported native architecture
        run: node -e "if(process.platform!=='darwin'||process.arch!=='arm64')process.exit(1)"
        timeout-minutes: 1
      - name: Verify compiler and SDK
        run: /usr/bin/clang --version && /usr/bin/xcrun --show-sdk-path
        timeout-minutes: 1
      - name: Generate Prisma client
        run: pnpm --filter backend prisma:generate
        timeout-minutes: 5
      - name: Build backend
        run: pnpm --filter backend build
        timeout-minutes: 5
        env:
          NODE_ENV: production
      - name: Portable desktop contracts
        run: pnpm --filter desktop test
        timeout-minutes: 8
      - name: Build native guardian and shell
        run: pnpm --filter desktop build:native
        timeout-minutes: 5
      - name: Headless native fixtures
        run: pnpm --filter desktop test:native
        timeout-minutes: 8
    name: desktop-native
  orchestrator:
    needs: validation-selection
    if: ${{ !cancelled() && (needs.validation-selection.result != 'success' || fromJSON(needs.validation-selection.outputs.lanes).orchestrator) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.0.8
        with:
          version: 10.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Verify toolchain
        run: node scripts/check-toolchain.mjs
        timeout-minutes: 1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        timeout-minutes: 10
      - name: Developer orchestrator
        run: |-
          pnpm --filter local-orchestrator test
          pnpm --filter local-orchestrator lint
          pnpm --filter local-orchestrator build
        timeout-minutes: 5
    name: local-orchestrator-checks
  eval:
    needs: validation-selection
    if: ${{ !cancelled() && (needs.validation-selection.result != 'success' || fromJSON(needs.validation-selection.outputs.lanes).eval) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.0.8
        with:
          version: 10.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Verify toolchain
        run: node scripts/check-toolchain.mjs
        timeout-minutes: 1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        timeout-minutes: 10
      - name: Evaluation fixture tests and validation
        run: pnpm eval:verify
        timeout-minutes: 5
    name: eval-fixture-checks
  harbor:
    needs: validation-selection
    if: ${{ !cancelled() && (needs.validation-selection.result != 'success' || fromJSON(needs.validation-selection.outputs.lanes).harbor) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Harbor static checks
        run: bash examples/eval-harbor/scripts/check_static.sh
        timeout-minutes: 5
    name: eval-harbor-checks
  packaging:
    needs: validation-selection
    if: ${{ !cancelled() && (needs.validation-selection.result != 'success' || fromJSON(needs.validation-selection.outputs.lanes).packaging) }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Initialize private runner caches
        run: |-
          {
            echo "COREPACK_HOME=$RUNNER_TEMP/corepack"
            echo "npm_config_store_dir=$RUNNER_TEMP/pnpm-store"
            echo "npm_config_cache=$RUNNER_TEMP/npm-cache"
            echo "XDG_CACHE_HOME=$RUNNER_TEMP/xdg-cache"
            echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/playwright"
          } >> "$GITHUB_ENV"
        timeout-minutes: 1
      - uses: pnpm/action-setup@v6.0.8
        with:
          version: 10.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Prepare private pinned Node
        run: bash scripts/local-migration/ci-private-node.sh
        timeout-minutes: 1
      - name: Verify toolchain
        run: node scripts/check-toolchain.mjs
        timeout-minutes: 1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        timeout-minutes: 10
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Seed offline package manager and native engine
        run: |-
          corepack prepare pnpm@10.25.0 --activate
          pnpm --filter backend exec prisma --version
        timeout-minutes: 5
      - name: Install pinned Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium
        timeout-minutes: 10
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright
      - name: Sealed package lifecycle and dependency closure
        run: pnpm migration:smoke:packaging
        timeout-minutes: 35
        env:
          MIGRATION_GATE_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          MIGRATION_TEST_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5433/postgres
          MIGRATION_GATE_PYTHON_BIN: python3
    name: packaging-qualification
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: context_router_test
        ports:
          - 5433:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
  restart:
    needs: validation-selection
    if: ${{ !cancelled() && (needs.validation-selection.result != 'success' || fromJSON(needs.validation-selection.outputs.lanes).restart) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Initialize private runner caches
        run: |-
          {
            echo "COREPACK_HOME=$RUNNER_TEMP/corepack"
            echo "npm_config_store_dir=$RUNNER_TEMP/pnpm-store"
            echo "npm_config_cache=$RUNNER_TEMP/npm-cache"
            echo "XDG_CACHE_HOME=$RUNNER_TEMP/xdg-cache"
            echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/playwright"
          } >> "$GITHUB_ENV"
        timeout-minutes: 1
      - uses: pnpm/action-setup@v6.0.8
        with:
          version: 10.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Prepare private pinned Node
        run: bash scripts/local-migration/ci-private-node.sh
        timeout-minutes: 1
      - name: Verify toolchain
        run: node scripts/check-toolchain.mjs
        timeout-minutes: 1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        timeout-minutes: 10
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Seed offline package manager and native engine
        run: |-
          corepack prepare pnpm@10.25.0 --activate
          pnpm --filter backend exec prisma --version
        timeout-minutes: 5
      - name: Install pinned Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium
        timeout-minutes: 10
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright
      - name: Source hosted OAuth and restart contracts
        run: pnpm migration:smoke:restart
        timeout-minutes: 20
        env:
          MIGRATION_GATE_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          MIGRATION_TEST_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5433/postgres
          MIGRATION_GATE_PYTHON_BIN: python3
    name: restart-smoke
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: context_router_test
        ports:
          - 5433:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
  local-migration-baseline:
    needs:
      - validation-selection
      - contracts
      - backend
      - postgres
      - web
      - packaging
      - desktop
      - orchestrator
      - eval
      - harbor
      - restart
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Require actual outcomes for independently selected checks
        run: node scripts/local-migration/ci-validation-policy.mjs --aggregate
        timeout-minutes: 2
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
