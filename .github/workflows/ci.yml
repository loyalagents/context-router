name: CI

on:
  push:
    branches: [main, hosted-v1-maintenance]
  pull_request:
    branches: [main, hosted-v1-maintenance]

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest

    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      local_orchestrator: ${{ steps.filter.outputs.local_orchestrator }}
      eval_fixtures: ${{ steps.filter.outputs.eval_fixtures }}
      eval_harbor: ${{ steps.filter.outputs.eval_harbor }}
      frontend: ${{ steps.filter.outputs.frontend }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - '.github/workflows/ci.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'apps/backend/**'
            local_orchestrator:
              - '.github/workflows/ci.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'apps/local-orchestrator/**'
            eval_fixtures:
              - '.github/workflows/ci.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'examples/eval/**'
              - 'apps/backend/package.json'
              - 'apps/backend/src/schema.gql'
              - 'apps/backend/src/config/preferences.catalog.json'
              - 'apps/backend/test/eval-runner/**'
            eval_harbor:
              - '.github/workflows/ci.yml'
              - 'examples/eval-harbor/**'
              - 'examples/eval_harbor_agents/**'
            frontend:
              - '.github/workflows/ci.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'apps/web/**'
              - 'apps/backend/src/schema.gql'

  backend-tests:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: context_router_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: apps/backend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Run database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/context_router_test

      - name: Run unit tests
        run: pnpm test:unit

      - name: Run integration tests
        run: pnpm test:integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/context_router_test

      - name: Run e2e tests
        run: pnpm test:e2e:tests-only
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/context_router_test

  local-orchestrator-checks:
    needs: changes
    if: needs.changes.outputs.local_orchestrator == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/local-orchestrator

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Run local-orchestrator tests
        run: pnpm test

      - name: Run local-orchestrator lint
        run: pnpm lint

      - name: Build local-orchestrator
        run: pnpm build

  eval-fixture-checks:
    needs: changes
    if: needs.changes.outputs.eval_fixtures == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run eval fixture tests
        run: pnpm eval:test

      - name: Validate eval fixtures
        run: pnpm eval:validate

  eval-harbor-checks:
    needs: changes
    if: needs.changes.outputs.eval_harbor == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run eval-harbor static checks
        run: bash examples/eval-harbor/scripts/check_static.sh

  frontend-build:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Build frontend
        run: pnpm build
