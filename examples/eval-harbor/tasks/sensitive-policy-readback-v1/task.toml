[verifier.env]

[environment.env]

[solution.env]

[[steps]]
name = "01-memory-build"

[steps.agent]
timeout_sec = 300.0

[steps.verifier]
timeout_sec = 30.0

[[steps]]
name = "02-readback"

[steps.agent]
timeout_sec = 300.0

[steps.verifier]
