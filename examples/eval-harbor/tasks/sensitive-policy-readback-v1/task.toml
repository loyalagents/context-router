schema_version = "1.3"

artifacts = [
  "/app/outputs/permissions-report.json",
  "/app/memory.md",
]

multi_step_reward_strategy = "final"

[task]
name = "context-router/sensitive-policy-readback-v1"
description = "Fresh-session permission-boundary readback task for allowed utility and blocked-data access prevention."
authors = []
keywords = ["context-router", "eval-harbor", "permissions", "fresh-session", "readback"]

[metadata]
