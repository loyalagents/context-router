schema_version = "1.3"

artifacts = [
  "/app/outputs/freshness-canary-report.json",
  "/app/freshness-probe-runtime.json",
  "/app/memory.md",
]

multi_step_reward_strategy = "final"

[task]
name = "context-router/sensitive-policy-freshness-canary-v1"
description = "Fresh-session canary for conversation and filesystem carryover before permission-boundary readback runs."
authors = []
keywords = ["context-router", "eval-harbor", "permissions", "freshness-canary"]

[metadata]
difficulty = "smoke"
category = "personal-memory"
tags = ["permissions", "freshness-canary", "multi-step"]

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 300.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
mcp_servers = []
workdir = "/app"

[verifier.env]

[environment.env]

[solution.env]

[[steps]]
name = "01-observe"

[steps.agent]
timeout_sec = 180.0

[steps.verifier]
timeout_sec = 30.0

[[steps]]
name = "02-readback"

[steps.agent]
timeout_sec = 180.0

[steps.verifier]
timeout_sec = 120.0
